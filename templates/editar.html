<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <h3 class="mb-4 text-center">Editar Produto: {{ produto.nome }}</h3>

        <div class="card shadow-sm">
            <div class="card-body">
                <form action="/editar/{{ produto.id }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nome do Produto</label>
                        <input type="text" name="nome" class="form-control" value="{{ produto.nome }}" maxlength="30" required>  
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição do Produto</label>
                        <textarea name="descricao" class="form-control" rows="3">{{ produto.descricao }}</textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Valor de Compra (R$)</label>
                            <input type="number" name="valor_compra" class="form-control" step="0.01" min="0" value="{{ produto.valor_compra }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Valor de Venda (R$)</label>
                            <input type="number" name="valor_venda" class="form-control" step="0.01" min="0" value="{{ produto.valor_venda }}" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Estoque</label>
                        <input type="number" name="estoque" class="form-control" min="0" value="{{ produto.quantidade_estoque }}" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-secondary">Voltar</a>
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                    </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
